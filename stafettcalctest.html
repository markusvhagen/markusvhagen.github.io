<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stafett Tidsplanlegger</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #f4f7fb 0%, #e8eef7 100%);
      min-height: 100vh;
      padding: 32px 16px;
      color: #1f2937;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
    }

    .hero {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }

    .hero h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .hero p {
      color: #6b7280;
      margin-bottom: 24px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      align-items: end;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #374151;
    }

    input {
      border: none;
      padding: 14px 16px;
      border-radius: 16px;
      background: #f3f4f6;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      background: white;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }

    button {
      border: none;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      padding: 14px 20px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      height: 52px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(37,99,235,0.2);
    }

    .progress-wrapper {
      background: rgba(255,255,255,0.9);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .progress-bar {
      display: flex;
      overflow: hidden;
      border-radius: 999px;
      height: 50px;
      background: #e5e7eb;
      margin-top: 18px;
    }

    .progress-segment {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: white;
      white-space: nowrap;
      height: 30px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .summary-card h3 {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .summary-card p {
      font-size: 1.6rem;
      font-weight: 800;
    }

    .stages {
      display: grid;
      gap: 18px;
    }

    .stage-card {
      background: rgba(255,255,255,0.9);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
    }

    .stage-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      background: #dbeafe;
      color: #1d4ed8;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .stage-info h2 {
      margin-bottom: 10px;
      font-size: 1.4rem;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .meta-item {
      background: #f3f4f6;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .time-box {
      background: #f9fafb;
      border-radius: 16px;
      padding: 14px;
    }

    .time-box span {
      display: block;
      color: #6b7280;
      font-size: 0.8rem;
      margin-bottom: 4px;
    }

    .time-box strong {
      font-size: 1.2rem;
    }

    .editor {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }

    .editor input {
      width: 100%;
    }

    .elevation-up {
      color: #dc2626;
    }

    .elevation-down {
      color: #059669;
    }

    @media (max-width: 850px) {
      .stage-card {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="app">

    <section class="hero">
      <h1>🏃‍♂️ Stafett Tidsplanlegger</h1>
      <p>
        Legg inn starttid og ønsket totaltid. Appen fordeler tiden automatisk
        basert på distanse og høydeprofil.
      </p>

      <div class="controls">

        <div class="input-group">
          <label for="startTime">Starttid</label>
          <input type="time" id="startTime" value="18:00" />
        </div>

        <div class="input-group">
          <label for="totalTime">Ønsket totaltid</label>
          <input type="text" id="totalTime" value="1:45:00" placeholder="t:mm:ss" />
        </div>

        <button id="calculateBtn">Fordel tider</button>
      </div>
    </section>

    <section class="progress-wrapper">
      <h2 style="margin-bottom:10px;">Tidsfordeling per etappe</h2>
      <p style="color:#6b7280;">Visualisering av hvor mye tid hver etappe bruker.</p>

      <div class="progress-bar" id="progressBar"></div>
    </section>

    <section class="summary">
      <div class="summary-card">
        <h3>Total distanse</h3>
        <p id="totalDistance"></p>
      </div>

      <div class="summary-card">
        <h3>Total tid</h3>
        <p id="totalDuration"></p>
      </div>

      <div class="summary-card">
        <h3>Gjennomsnittsfart</h3>
        <p id="avgPace"></p>
      </div>
    </section>

    <section class="stages" id="stages"></section>

  </div>

  <script>
    const stages = [
      { name: 'Etappe 1', distance: 1609, elevation: 1 },
      { name: 'Etappe 2', distance: 2590, elevation: 7 },
      { name: 'Etappe 3', distance: 1000, elevation: 10 },
      { name: 'Etappe 4', distance: 2900, elevation: 24 },
      { name: 'Etappe 5', distance: 1750, elevation: -21 },
      { name: 'Etappe 6', distance: 1609, elevation: -8 },
      { name: 'Etappe 7', distance: 2720, elevation: 106 },
      { name: 'Etappe 8', distance: 3150, elevation: -136 },
      { name: 'Etappe 9', distance: 800, elevation: -9 },
      { name: 'Etappe 10', distance: 2580, elevation: 0 }
    ];

    const stagesContainer = document.getElementById('stages');

    function timeToMinutes(timeString) {
      const [hours, minutes] = timeString.split(':').map(Number);
      return hours * 60 + minutes;
    }

    function minutesToTime(minutes) {
      minutes = Math.round(minutes);

      const hrs = Math.floor(minutes / 60) % 24;
      const mins = minutes % 60;

      return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
    }

    function formatDuration(minutes) {
      const totalSeconds = Math.round(minutes * 60);

      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;

      return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function formatStageDuration(minutes) {
      const mins = Math.floor(minutes);
      const secs = Math.round((minutes - mins) * 60);

      return `${mins}m ${String(secs).padStart(2, '0')}s`;
    }

    function calculateWeights() {
      return stages.map(stage => {
        const elevationFactor = stage.elevation > 0
          ? stage.elevation * 12
          : stage.elevation * 4;

        return stage.distance + elevationFactor;
      });
    }

    function calculateSchedule() {
      const startTime = document.getElementById('startTime').value;
      const totalTime = document.getElementById('totalTime').value;

      let startMinutes = timeToMinutes(startTime);

      const [hours, minutes, seconds] = totalTime.split(':').map(Number);

      const totalMinutes = (hours * 60) + minutes + (seconds / 60);

      const weights = calculateWeights();
      const totalWeight = weights.reduce((sum, value) => sum + value, 0);

      let currentTime = startMinutes;

      stages.forEach((stage, index) => {
        stage.allocatedMinutes = (weights[index] / totalWeight) * totalMinutes;
        stage.start = currentTime;
        stage.end = currentTime + stage.allocatedMinutes;

        currentTime += stage.allocatedMinutes;
      });

      renderStages();
      renderProgressBar();
      updateSummary(totalMinutes);
    }

    function updateSummary(totalMinutes) {
      const totalDistanceMeters = stages.reduce((sum, stage) => sum + stage.distance, 0);
      const totalDistanceKm = totalDistanceMeters / 1000;

      document.getElementById('totalDistance').textContent = `${totalDistanceKm.toFixed(1)} km`;

      document.getElementById('totalDuration').textContent = formatDuration(totalMinutes);

      const pace = totalMinutes / totalDistanceKm;
      const paceMin = Math.floor(pace);
      const paceSec = Math.round((pace - paceMin) * 60);

      document.getElementById('avgPace').textContent = `${paceMin}:${String(paceSec).padStart(2, '0')} /km`;
    }

    function calculatePace(distance, minutes) {
      const km = distance / 1000;
      const pace = minutes / km;

      const mins = Math.floor(pace);
      const secs = Math.round((pace - mins) * 60);

      return `${mins}:${String(secs).padStart(2, '0')} /km`;
    }

    function renderProgressBar() {
      const progressBar = document.getElementById('progressBar');
      progressBar.innerHTML = '';

      stages.forEach((stage, index) => {
        const wrapper = document.createElement('div');

        wrapper.style.flex = `${stage.allocatedMinutes}`;
        wrapper.style.display = 'flex';
        wrapper.style.flexDirection = 'column';
        wrapper.style.alignItems = 'center';
        wrapper.style.gap = '6px';

        const segment = document.createElement('div');
        segment.className = 'progress-segment';

        const hue = index * 36;
        const color = `hsl(${hue}, 75%, 55%)`;

        segment.style.background = color;
        segment.style.width = '100%';

        segment.textContent = `E${index + 1}`;

        const pace = document.createElement('div');
        pace.textContent = calculatePace(stage.distance, stage.allocatedMinutes);
        pace.style.color = color;
        pace.style.fontWeight = '700';
        pace.style.fontSize = '0.75rem';

        wrapper.appendChild(segment);
        wrapper.appendChild(pace);

        progressBar.appendChild(wrapper);
      });
    }

    function renderStages() {
      stagesContainer.innerHTML = '';

      stages.forEach((stage, index) => {

        const elevationClass = stage.elevation >= 0
          ? 'elevation-up'
          : 'elevation-down';

        const card = document.createElement('div');
        card.className = 'stage-card';

        card.innerHTML = `
          <div class="stage-info">

            <div class="stage-top">
              <h2>${stage.name}</h2>

            </div>

            <div class="meta">
              <div class="meta-item">
                ${(stage.distance / 1000).toFixed(2)} km
              </div>

              <div class="meta-item ${elevationClass}">
                ${stage.elevation >= 0 ? '+' : ''}${stage.elevation} m
              </div>
            </div>

            <div class="timeline">
              <div class="time-box">
                <span>Møt opp</span>
                <strong>${minutesToTime(stage.start - 10)}</strong>
              </div>

              <div class="time-box">
                <span>Start etappe</span>
                <strong>${minutesToTime(stage.start)}</strong>
              </div>

              <div class="time-box">
                <span>Forventet mål</span>
                <strong>${minutesToTime(stage.end)}</strong>
              </div>

              <div class="time-box">
                <span>Etappetid</span>
                <strong>${formatStageDuration(stage.allocatedMinutes)}</strong>
              </div>


            </div>
          </div>

          <div class="editor">
            <label>Juster etappetid</label>

            <div style="display:flex; gap:10px; align-items:center;">
              <input
                type="number"
                min="0"
                max="59"
                value="${Math.floor(stage.allocatedMinutes)}"
                data-index="${index}"
                data-type="minutes"
                class="time-editor"
              />

              <span style="font-weight:800; font-size:1.2rem;">:</span>

              <input
                type="number"
                min="0"
                max="59"
                value="${Math.round((stage.allocatedMinutes - Math.floor(stage.allocatedMinutes)) * 60)}"
                data-index="${index}"
                data-type="seconds"
                class="time-editor"
              />
            </div>

            <div style="background:#f3f4f6; border-radius:16px; padding:14px;">
              <div style="font-size:0.8rem; color:#6b7280; margin-bottom:4px;">
                Pace
              </div>

              <div style="font-size:1.1rem; font-weight:800;">
                ${calculatePace(stage.distance, stage.allocatedMinutes)}
              </div>
            </div>

            <small>
              Når du endrer tiden oppdateres alle starttidene automatisk.
            </small>
          </div>
        `;

        stagesContainer.appendChild(card);
      });

      document.querySelectorAll('.time-editor').forEach(input => {
        input.addEventListener('input', handleManualEdit);
      });
    }

    function handleManualEdit() {
      const startMinutes = timeToMinutes(document.getElementById('startTime').value);

      let currentTime = startMinutes;

      stages.forEach((stage, index) => {
        const minuteInput = document.querySelector(`[data-index="${index}"][data-type="minutes"]`);
        const secondInput = document.querySelector(`[data-index="${index}"][data-type="seconds"]`);

        const mins = Number(minuteInput.value || 0);
        const secs = Number(secondInput.value || 0);

        const value = mins + (secs / 60);

        stages[index].allocatedMinutes = value;
        stages[index].start = currentTime;
        stages[index].end = currentTime + value;

        currentTime += value;
      });

      renderStages();
      renderProgressBar();
      updateSummary(currentTime - startMinutes);
    }

    document.getElementById('calculateBtn').addEventListener('click', calculateSchedule);

    calculateSchedule();
  </script>

</body>
</html>
